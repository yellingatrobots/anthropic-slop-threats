    let spinning = false;
    let history = [];

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function spin() {
      if (spinning) return;
      spinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('result').classList.remove('visible');

      const catReel = document.getElementById('categoryReel');
      const topReel = document.getElementById('topicReel');
      const catVal = document.getElementById('categoryValue');
      const topVal = document.getElementById('topicValue');

      catReel.classList.add('spinning');
      topReel.classList.add('spinning');
      catReel.classList.remove('locked', 'final');
      topReel.classList.remove('locked', 'final');

      const spinDuration = 1600;
      const startTime = Date.now();
      while (Date.now() - startTime < spinDuration) {
        catVal.textContent = pickRandom(data).category;
        await sleep(55);
      }

      const selectedCategory = pickRandom(data);
      catVal.textContent = selectedCategory.category;
      catReel.classList.remove('spinning');
      catReel.classList.add('locked');

      await sleep(350);

      const spinDuration2 = 1300;
      const startTime2 = Date.now();
      while (Date.now() - startTime2 < spinDuration2) {
        topVal.textContent = pickRandom(selectedCategory.topics).title;
        await sleep(65);
      }

      const selectedTopic = pickRandom(selectedCategory.topics);
      topVal.textContent = selectedTopic.title;
      topReel.classList.remove('spinning');
      topReel.classList.add('final');

      await sleep(250);
      showResult(selectedCategory, selectedTopic);
      addToHistory(selectedCategory, selectedTopic);
      fireConfetti();

      spinning = false;
      document.getElementById('spinBtn').disabled = false;
    }

    function showResult(cat, topic) {
      document.getElementById('resultCategory').textContent = cat.category;
      document.getElementById('resultCategory').style.background = cat.color + '18';
      document.getElementById('resultCategory').style.color = cat.color;
      document.getElementById('resultCategory').style.border = '1px solid ' + cat.color + '40';
      document.getElementById('resultTitle').textContent = topic.title;
      document.getElementById('resultTitle').style.color = cat.color;
      document.getElementById('tldrText').textContent = topic.tldr;
      document.getElementById('tldrByline').textContent = pickRandom(bylines);

      const meta = document.getElementById('metaTags');
      meta.innerHTML = '';
      topic.tags.forEach((tag, i) => {
        const span = document.createElement('span');
        span.className = 'meta-tag';
        span.textContent = tag;
        if (i === 0) {
          span.style.borderColor = cat.color + '50';
          span.style.color = cat.color;
        }
        meta.appendChild(span);
      });

      document.getElementById('result').classList.add('visible');
      document.getElementById('spinBtn').textContent = 'Spin Again';
    }

    function resetStage() {
      document.getElementById('result').classList.remove('visible');
      document.getElementById('categoryValue').textContent = 'Press spin, cowards';
      document.getElementById('topicValue').textContent = '???';
      document.getElementById('categoryReel').classList.remove('locked', 'final');
      document.getElementById('topicReel').classList.remove('locked', 'final');
      document.getElementById('spinBtn').textContent = 'Spin the Wheel';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function addToHistory(cat, topic) {
      history.unshift({ cat: cat.category, topic: topic.title, color: cat.color });
      if (history.length > 5) history.pop();

      const histEl = document.getElementById('history');
      const listEl = document.getElementById('historyList');
      listEl.innerHTML = '';

      history.forEach(h => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<span class="hist-cat" style="color:${h.color}">${h.cat}</span><span class="hist-topic">${h.topic}</span>`;
        listEl.appendChild(div);
      });

      histEl.style.display = 'block';
    }

    function fireConfetti() {
      const colors = ['#e54b4b', '#f0a030', '#4db8a0', '#7c6fae', '#e8e8ee'];
      const container = document.createElement('div');
      container.className = 'confetti';
      const rect = document.getElementById('spinBtn').getBoundingClientRect();
      container.style.left = (rect.left + rect.width / 2 - 100) + 'px';
      container.style.top = (rect.top - 40) + 'px';

      for (let i = 0; i < 24; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = Math.random() * 200 + 'px';
        piece.style.top = '0px';
        piece.style.animationDelay = (Math.random() * 0.25) + 's';
        piece.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
        container.appendChild(piece);
      }

      document.body.appendChild(container);
      setTimeout(() => container.remove(), 2200);
    }
  </script>
